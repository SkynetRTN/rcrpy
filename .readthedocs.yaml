# Read the Docs configuration for the rcrpy package.
# https://docs.readthedocs.io/en/stable/config-file/v2.html
#
# NOTE: This file lives at the repository root and builds the Python package
# docs under rcrpy/. All paths below are relative to the repository root,
# regardless of where this file sits. The frozen C++ docs keep their own
# (legacy) config at cpp/.readthedocs.yml; if you want those on RTD too, make
# a second RTD project whose "Path for .readthedocs.yaml" points at it.

version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.12"

sphinx:
  configuration: rcrpy/docs/conf.py
  # fail_on_warning: true   # flip on once the docs build cleanly in CI

# Install the package (hatchling build backend) plus the "docs" extra so that
# autodoc can import rcrpy and find Sphinx/furo/myst-parser.
python:
  install:
    - method: pip
      path: rcrpy
      extra_requirements:
        - docs

# Optional extra output formats (uncomment if you want them):
# formats:
#   - pdf
#   - epub
