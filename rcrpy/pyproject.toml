[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "rcrpy"
version = "0.1.2"
description = "Robust Chauvenet Rejection (RCR), Python reimplementation"
requires-python = ">=3.11"
readme = "README.md"
license = {file = "LICENSE"}
authors = [
    {name = "Reece Clark", email = "reececar@unc.edu"},
    {name = "Ruide Fu", email = "rdfu@unc.edu"},
]
maintainers = [
    {name = "Ruide Fu", email = "rdfu@unc.edu"},
]
keywords = ["statistics", "outlier-rejection", "robust-statistics", "astronomy", "chauvenet"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: Other/Proprietary License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Astronomy",
    "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
]

[project.optional-dependencies]
docs = [
    "sphinx>=7",
    "furo",
    "myst-parser",
]
# Optional Numba JIT acceleration of the DL-sigma kernels (rcrpy.enable_fast()).
# Pure-Python remains the bit-exact default; this only adds speed.
fast = [
    "numba>=0.59",
]

[project.urls]
Homepage = "https://github.com/SkynetRTN/rcrpy"
Repository = "https://github.com/SkynetRTN/rcrpy"
Documentation = "https://rcrpy.readthedocs.io/"
Issues = "https://github.com/SkynetRTN/rcrpy/issues"
Paper = "https://arxiv.org/abs/1807.05276"

[dependency-groups]
dev = [
    "pytest>=8",
    "rcr>=2.4",
]

[tool.hatch.build.targets.wheel]
packages = ["src/rcrpy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
