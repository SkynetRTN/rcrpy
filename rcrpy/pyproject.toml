[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "rcrpy"
version = "0.1.0"
description = "Robust Chauvenet Rejection (RCR), Python reimplementation"
requires-python = ">=3.11"
readme = "README.md"
license = {file = "LICENSE"}
authors = [
    {name = "Haislip", email = "haislip@physics.unc.edu"},
]
maintainers = [
    {name = "UNC Physics RCR successors", email = "haislip@physics.unc.edu"},
]
keywords = ["statistics", "outlier-rejection", "robust-statistics", "astronomy", "chauvenet"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: Other/Proprietary License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Astronomy",
    "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
]

[project.urls]
Homepage = "https://github.com/nickk124/RCR"
Repository = "https://github.com/nickk124/RCR"
Issues = "https://github.com/nickk124/RCR/issues"
Paper = "https://arxiv.org/abs/1807.05276"

[dependency-groups]
dev = [
    "pytest>=8",
    "rcr>=2.4",
]

[tool.hatch.build.targets.wheel]
packages = ["src/rcrpy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
