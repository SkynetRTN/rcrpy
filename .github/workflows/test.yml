name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  pytest:
    name: pytest (Python ${{ matrix.python-version }} on ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # rcr2 is pure Python; one OS is sufficient for correctness, but
        # we test 3 Python versions to catch any version-specific regressions.
        os: [ubuntu-latest]
        python-version: ["3.11", "3.12", "3.13"]
        include:
          # Sanity sweep on the other major OSes for one Python version.
          - os: macos-latest
            python-version: "3.13"
          - os: windows-latest
            python-version: "3.13"

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install rcr2 (editable) + dev deps
        run: |
          python -m pip install --upgrade pip
          # `legacy_rcr` (the C++ oracle) provides bit-identical parity
          # checks for Phase 1 tests. Pulled in via the [dev] extra. If
          # the wheel for this Python is unavailable, the parity tests
          # auto-skip via pytest.importorskip.
          python -m pip install -e ./python[dev]

      - name: Run pytest
        working-directory: ./python
        run: pytest -v --tb=short

  build:
    name: Build sdist and wheel
    runs-on: ubuntu-latest
    needs: pytest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install build tools
        run: python -m pip install --upgrade pip build
      - name: Build distributions
        run: python -m build ./python
      - name: List artifacts
        run: ls -la python/dist/
      - name: Upload distributions
        uses: actions/upload-artifact@v4
        with:
          name: rcr2-distributions
          path: python/dist/*
          retention-days: 14
